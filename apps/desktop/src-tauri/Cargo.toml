[package]
name = "ethiopic-voice-studio"
version = "0.1.0-rc.2"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
prototype-core = { path = "../../../crates/prototype-core" }
sysinfo = "0.33"


serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
transcripts = { path = "../../../crates/transcripts" }
hound = "3.5"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "isomp4", "aac", "alac"] }
sha2 = "0.10"
fs2 = "0.4"
home-content = { path = "../../../crates/home-content" }
resource-packs = { path = "../../../crates/resource-packs" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
