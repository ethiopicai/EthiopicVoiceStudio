name: Desktop preview packages
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Attach all three installers to a draft GitHub prerelease
        type: boolean
        default: false
      tag:
        description: Optional release tag; must match the app version (for example v0.1.0-rc.2)
        type: string
        required: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-intel-interface-preview
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Remap build paths before compiling
        run: python scripts/build-privacy.py --github-env "$env:GITHUB_ENV"
        shell: pwsh
      - run: npm ci
      - run: npm ci --prefix apps/desktop/ui
      - run: npm run test:ui
      - run: npm run build:ui
      - run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - run: cargo test --workspace --locked -- --test-threads=1
      - name: Build Mac review candidate
        if: runner.os == 'macOS'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python scripts/build-macos-release.py --candidate --target "$PACKAGE_TARGET"
      - name: Build Windows review installer
        if: runner.os == 'Windows'
        run: npm run build:windows
      - name: Verify and stage only the installer, checksum and metadata
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python scripts/prepare-github-packages.py stage --target "$env:PACKAGE_TARGET" --commit "$env:GITHUB_SHA" --output .release/github-assets
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-${{ matrix.label }}
          path: |
            .release/github-assets/*.dmg
            .release/github-assets/*.exe
            .release/github-assets/*.sha256
            .release/github-assets/*.json
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: package
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: studio-*
          path: .release/downloaded-packages
          merge-multiple: true
      - name: Verify all three packages and prepare release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python scripts/prepare-github-packages.py draft --assets .release/downloaded-packages --output .release/draft --commit "$GITHUB_SHA" --tag "$RELEASE_TAG"
      - name: Create draft only; publication stays manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat .release/draft/release-tag.txt)"
          mapfile -t assets < .release/draft/release-files.txt
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EthiopicAI Voice Studio $tag preview" --notes-file .release/draft/RELEASE_NOTES.md --draft --prerelease
