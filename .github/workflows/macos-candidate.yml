name: macOS review candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm ci --prefix apps/desktop/ui
      - run: npm run test:release-tools
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: npm --prefix apps/desktop/ui test
      - run: npm run build:mac-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-local-review-only
          path: |
            .release/macos-*-candidate/*.dmg
            .release/macos-*-candidate/*.dmg.sha256
            .release/macos-*-candidate/build-status.json
          if-no-files-found: error
          retention-days: 7
