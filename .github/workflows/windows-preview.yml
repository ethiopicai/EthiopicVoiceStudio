name: Windows development preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Remap build paths before compiling
        run: python scripts/build-privacy.py --github-env "$env:GITHUB_ENV"
        shell: pwsh
      - run: npm ci
      - run: npm ci --prefix apps/desktop/ui
      - run: npm run test:ui
      - run: npm run build:ui
      # Match the isolated native-test execution used by the macOS checks.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: npm run build:windows
      - run: python scripts/prepare-github-packages.py stage --target x86_64-pc-windows-msvc --commit "$env:GITHUB_SHA" --output .release/github-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unsigned-development-preview
          path: |
            .release/github-assets/*.exe
            .release/github-assets/*.sha256
            .release/github-assets/*.json
          if-no-files-found: error
          retention-days: 7
