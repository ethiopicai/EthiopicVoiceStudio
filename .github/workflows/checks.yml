name: Functional checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix apps/desktop/ui
      - run: npm --prefix apps/desktop/ui test
      - run: npm run build:ui
      - run: test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - run: npm --prefix apps/desktop/ui run test:browser
      - run: npm run test:release-tools
      - run: cargo fmt --all --check
      # Native tests exercise process-global worker pools and child-process locks.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo clippy --workspace --locked -- -D warnings

